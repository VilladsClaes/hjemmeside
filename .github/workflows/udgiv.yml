# Kopierer hjemmesiden til webhotellet via FTP, hver gang der pushes til master.
# Kun ændrede filer bliver sendt. Login-oplysningerne ligger som "secrets" i GitHub
# (Settings → Secrets and variables → Actions) og står aldrig i koden.
name: Udgiv til webhotel

on:
  push:
    branches: [master]
  workflow_dispatch: # gør det muligt at starte en udgivelse manuelt fra fanen "Actions"

concurrency:
  group: udgiv
  cancel-in-progress: false

jobs:
  udgiv:
    runs-on: ubuntu-latest
    env:
      HAR_FTP: ${{ secrets.FTP_SERVER != '' }}
    steps:
      - name: Mangler FTP-oplysninger?
        if: env.HAR_FTP != 'true'
        run: echo "::warning::FTP-secrets er ikke sat op endnu, så intet blev uploadet. Se README.md."

      - name: Hent koden
        if: env.HAR_FTP == 'true'
        uses: actions/checkout@v5

      # Musikken på forsiden henter data fra Last.fm via api/lastfm.php, som skal bruge en API-nøgle.
      # Nøglen skrives til en fil, der kun ligger på webhotellet og aldrig kommer i git.
      - name: Gem Last.fm-nøglen
        if: env.HAR_FTP == 'true'
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: |
          if [[ ! "$LASTFM_API_KEY" =~ ^[0-9a-f]{32}$ ]]; then
            echo "::warning::LASTFM_API_KEY mangler eller ser forkert ud, så musik-sektionen bliver ikke vist. Se README.md."
            exit 0
          fi
          printf "<?php return '%s';\n" "$LASTFM_API_KEY" > api/lastfm-noegle.php

      - name: Upload via FTP
        if: env.HAR_FTP == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_BRUGER }}
          password: ${{ secrets.FTP_ADGANGSKODE }}
          server-dir: ${{ secrets.FTP_MAPPE }}   # skal slutte med / f.eks. public_html/
          protocol: ftps                          # krypteret. Skift til ftp hvis webhotellet ikke understøtter det
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .claude/**
            README.md
            api/lastfm-eksempel.json
